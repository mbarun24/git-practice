<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <title>Welcome — A little space to begin</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #20243a;
      background: #f7f8fc;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
    }

    .page {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      width: min(1120px, calc(100% - 48px));
      align-items: center;
      justify-content: space-between;
      margin: 0 auto;
      padding: 28px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: -0.03em;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 11px;
      background: #6558e8;
      color: #fff;
      font-size: 16px;
    }

    .header-note {
      color: #777b91;
      font-size: 13px;
    }

    main {
      display: grid;
      flex: 1;
      place-items: center;
      padding: 56px 24px 88px;
    }

    .welcome {
      width: min(100%, 720px);
      padding: clamp(32px, 7vw, 72px);
      border: 1px solid #e9eaf2;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 24px 80px rgb(34 40 80 / 8%);
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 22px;
      color: #6558e8;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .sparkle {
      font-size: 16px;
    }

    h1 {
      max-width: 560px;
      margin: 0 auto;
      font-size: clamp(40px, 8vw, 68px);
      font-weight: 760;
      letter-spacing: -0.065em;
      line-height: 1.04;
    }

    h1 span {
      color: #6558e8;
    }

    .intro {
      max-width: 450px;
      margin: 22px auto 0;
      color: #777b91;
      font-size: 16px;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 32px;
    }

    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 0 21px;
      border: 1px solid transparent;
      border-radius: 13px;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
      transition: transform 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button:focus-visible,
    .brand:focus-visible {
      outline: 3px solid #aaa3ff;
      outline-offset: 4px;
    }

    .button-primary {
      background: #6558e8;
      box-shadow: 0 8px 18px rgb(101 88 232 / 24%);
      color: #fff;
    }

    .button-primary:hover {
      background: #5144d1;
    }

    .button-secondary {
      border-color: #e6e7ef;
      background: #fff;
      color: #42465d;
    }

    .button-secondary:hover {
      background: #f7f8fc;
    }

    footer {
      padding: 0 24px 25px;
      color: #9295a7;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 480px) {
      header {
        width: calc(100% - 36px);
        padding: 20px 0;
      }

      .header-note {
        font-size: 12px;
      }

      main {
        padding: 32px 18px 48px;
      }

      .welcome {
        border-radius: 22px;
      }

      .actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="#" aria-label="Daylight home">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>daylight</span>
      </a>
      <span class="header-note">A little space to begin</span>
    </header>

    <main>
      <section class="welcome" aria-labelledby="welcome-title">
        <p class="eyebrow"><span class="sparkle" aria-hidden="true">✳</span> Your next chapter</p>
        <h1 id="welcome-title">Make room for <span>what matters.</span></h1>
        <p class="intro">A fresh start doesn't need a grand plan. Take a breath, find your focus, and begin with one small step.</p>
        <div class="actions">
          <a class="button button-primary" href="mailto:hello@example.com">Let’s get started <span aria-hidden="true">&nbsp;→</span></a>
          <a class="button button-secondary" href="#about">Take a look around</a>
        </div>
      </section>
    </main>

    <footer id="about">Made for fresh starts, big and small.</footer>
  </div>
</body>
</html>
